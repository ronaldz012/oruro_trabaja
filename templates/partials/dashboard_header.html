{% load static %}
<header class="sticky top-0 z-30 border-b border-border bg-surface">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-2 sm:px-6 lg:px-8">
    <div class="flex items-center gap-2">
      {% if mostrar_menu %}
        <button type="button"
                id="sidebar-toggle"
                aria-controls="sidebar"
                aria-expanded="false"
                aria-label="Abrir menú"
                class="grid h-9 w-9 place-items-center rounded-lg border border-border text-secondary-700 hover:bg-secondary-50 lg:hidden">
          <span class="mi">menu</span>
        </button>
      {% endif %}

      {% include "partials/brand.html" with brand_small=True %}
    </div>

    <div class="relative">
      <button type="button"
              id="user-menu-boton"
              aria-controls="user-menu"
              aria-haspopup="true"
              aria-expanded="false"
              aria-label="Abrir menú de usuario"
              class="hover:opacity-80">
        {% if user.role.codigo == "POSTULANTE" and user.postulante_profile.foto %}
          <img src="{{ user.postulante_profile.foto.url }}" alt="Tu foto de perfil" class="h-9 w-9 rounded-full object-cover">
        {% elif user.role.codigo == "EMPRESA" and user.empresa.logo %}
          <img src="{{ user.empresa.logo.url }}" alt="Logo de la empresa" class="h-9 w-9 rounded-full object-cover">
        {% else %}
          <span class="grid h-9 w-9 place-items-center rounded-full bg-secondary-100 text-sm font-bold text-secondary-700">
            {{ user.first_name|first|default:"U" }}
          </span>
        {% endif %}
      </button>

      <div id="user-menu" class="absolute right-0 z-50 mt-2 hidden w-56 rounded-lg border border-border bg-surface py-2 shadow-lg">
        <div class="px-4 py-2">
          {% if user.first_name or user.last_name %}
            <p class="text-sm font-bold text-secondary-900">{{ user.first_name }} {{ user.last_name }}</p>
          {% endif %}
          <p class="text-xs text-text-muted{% if not user.first_name and not user.last_name %} font-bold text-secondary-800{% endif %}">{{ user.email }}</p>
        </div>
        <div class="border-t border-border py-2">
          <a href="{% url 'accounts:mi_cuenta' %}" class="block px-4 py-2 text-left text-sm font-semibold text-secondary-700 hover:bg-secondary-50">
            Mi cuenta
          </a>
          <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="block w-full px-4 py-2 text-left text-sm font-semibold text-secondary-700 hover:bg-secondary-50">
              Salir
            </button>
          </form>
        </div>
      </div>

      <noscript>
        <style>
          #user-menu { display: block; }
        </style>
      </noscript>
    </div>
  </div>
</header>
