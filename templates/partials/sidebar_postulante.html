{% with actual=request.resolver_match.url_name namespace=request.resolver_match.namespace %}
<aside id="sidebar"
       aria-label="Navegación del postulante"
       class="fixed inset-y-0 left-0 z-50 flex w-64 -translate-x-full flex-col border-r border-border bg-surface transition-transform duration-200 ease-out lg:sticky lg:top-0 lg:z-auto lg:h-screen lg:translate-x-0">

  <div class="flex items-center justify-between border-b border-border px-4 py-4 lg:hidden">
    <span class="text-sm font-bold text-secondary-900">Menú</span>
    <button type="button" data-sidebar-close aria-label="Cerrar menú"
            class="grid h-9 w-9 place-items-center rounded-lg text-secondary-500 hover:bg-secondary-50">
      <span class="mi">close</span>
    </button>
  </div>

  <div class="hidden px-4 py-5 lg:block">
    <p class="mini-label font-bold">Mi cuenta</p>
    <p class="mt-1 truncate text-sm font-semibold text-secondary-900">
      {{ user.first_name|default:user.email }}
    </p>
  </div>

  <nav class="flex-1 space-y-1 px-3 py-3">
    <a href="{% url 'dashboard:postulante' %}"
       class="nav-link {% if actual == 'postulante' %}is-active{% endif %}"
       {% if actual == 'postulante' %}aria-current="page"{% endif %}>
      <span class="mi">home</span>
      Dashboard
    </a>

    <a href="{% url 'postulantes:perfil' %}"
       class="nav-link {% if actual == 'perfil' %}is-active{% endif %}"
       {% if actual == 'perfil' %}aria-current="page"{% endif %}>
      <span class="mi">person</span>
      Mi perfil
    </a>

    <a href="{% url 'ofertas:publicas' %}"
       class="nav-link {% if actual == 'publicas' or actual == 'detalle' or actual == 'postular' %}is-active{% endif %}"
       {% if actual == 'publicas' or actual == 'detalle' or actual == 'postular' %}aria-current="page"{% endif %}>
      <span class="mi">work</span>
      Empleos
    </a>

    <a href="{% url 'ofertas:mis_postulaciones' %}"
       class="nav-link {% if actual == 'mis_postulaciones' %}is-active{% endif %}"
       {% if actual == 'mis_postulaciones' %}aria-current="page"{% endif %}>
      <span class="mi">description</span>
      Mis postulaciones
    </a>
  </nav>

  <div class="border-t border-border px-4 py-4">
    <p class="mini-label">Oruro Trabaja</p>
    <p class="mt-1 text-xs text-text-muted">GADOR · Oruro</p>
  </div>
</aside>
{% endwith %}
